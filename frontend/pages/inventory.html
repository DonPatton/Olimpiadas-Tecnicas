<!DOCTYPE html>
<html lang="es">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory · Inventory Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="inventory">
  <div class="app">

    <app-sidebar></app-sidebar>

    <!-- ============ MAIN ============ -->
    <main class="main">

      <app-topbar></app-topbar>

      <section class="content">
        <div class="content-header">
          <h1 class="page-title">Inventory</h1>
          <button class="btn btn-primary" data-needs-backend="Agregar producto nuevo">
            Add New
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Total SKUs</div>
            <div class="stat-value" id="stat-total-skus">—</div>
            <div class="stat-delta up">+6 this month</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Units in Stock</div>
            <div class="stat-value" id="stat-units-in-stock">—</div>
            <div class="stat-delta up">+3.2%</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Low Stock Items</div>
            <div class="stat-value" id="stat-low-stock">—</div>
            <div class="stat-delta down">needs reorder</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Out of Stock</div>
            <div class="stat-value" id="stat-out-of-stock">—</div>
            <div class="stat-delta down">check warehouse</div>
          </div>
        </div>

        <div class="filter-row">
          <div class="filter-chip active" data-filter="all">All Categories</div>
          <div class="filter-chip" data-filter="Clothing">Clothing</div>
          <div class="filter-chip" data-filter="Footwear">Footwear</div>
          <div class="filter-chip" data-filter="Boots">Boots</div>
          <div class="filter-chip" data-filter="Socks">Socks</div>
        </div>

        <div class="table-wrap">
          <table id="inventory-table">
            <thead>
              <tr>
                <th><input type="checkbox"></th>
                <th>SKU</th>
                <th>Product</th>
                <th>Category</th>
                <th>Location</th>
                <th>QTY</th>
                <th>Reorder Point</th>
                <th>Status</th>
                <th class="col-filter">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg>
                </th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
