<!DOCTYPE html>
<html lang="es">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes · Panel de Control de Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="reports">
  <div class="app">

    <app-sidebar></app-sidebar>

    <!-- ============ MAIN ============ -->
    <main class="main">

      <app-topbar></app-topbar>

      <section class="content">
        <div class="content-header">
          <h1 class="page-title">Reportes</h1>
          <button class="btn btn-ghost" data-export="#top-products-table">
            Exportar CSV
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>

        <div class="stat-grid">
          <div class="stat-card"><div class="stat-label">Ingresos totales (30d)</div><div class="stat-value" id="stat-revenue">—</div><div class="stat-delta up">+12.4%</div></div>
          <div class="stat-card"><div class="stat-label">Pedidos (30d)</div><div class="stat-value" id="stat-orders">—</div><div class="stat-delta up">+6.1%</div></div>
          <div class="stat-card"><div class="stat-label">Unidades vendidas</div><div class="stat-value" id="stat-units-sold">—</div><div class="stat-delta up">+9.8%</div></div>
          <div class="stat-card"><div class="stat-label">Valor promedio del pedido</div><div class="stat-value" id="stat-aov">—</div><div class="stat-delta down">-1.2%</div></div>
        </div>

        <div class="chart-card">
          <div class="chart-card-head">
            <h3>Ingresos — Últimos 12 meses</h3>
            <span>en miles de USD</span>
          </div>
          <div class="bar-chart" id="revenue-chart"></div>
        </div>

        <div class="two-col">
          <div>
            <div class="section-title">Productos más vendidos</div>
            <div class="table-wrap">
              <table id="top-products-table">
                <thead><tr><th>Producto</th><th>Unidades vendidas</th><th>Ingresos</th></tr></thead>
                <tbody id="top-products-body"></tbody>
              </table>
            </div>
          </div>
          <div>
            <div class="section-title">Ventas por categoría</div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Categoría</th><th>Participación</th></tr></thead>
                <tbody id="sales-by-category-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
