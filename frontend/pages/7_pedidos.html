<!DOCTYPE html>
<html lang="es">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos · Panel de Control de Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .order-meta { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px; font-size:13px; color:var(--text-secondary); }
    .order-lines { display:flex; flex-direction:column; border-top:1px solid var(--row-line); }
    .order-line { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:16px; padding:10px 0; border-bottom:1px solid var(--row-line); font-size:13px; }
    .order-total { display:flex; justify-content:flex-end; align-items:baseline; gap:10px; margin:14px 0 4px; font-size:13px; color:var(--text-secondary); }
    .order-total strong { font-size:20px; color:var(--text-primary); }
    .order-empty { padding:14px 0; font-size:13px; opacity:.7; }
  </style>
</head>
<body data-page="pedidos">
  <div class="app">
    <app-sidebar></app-sidebar>
    <main class="main">
      <app-topbar></app-topbar>
      <section class="content">
        <div class="content-header">
          <h1 class="page-title">Pedidos</h1>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Total de pedidos</div>
            <div class="stat-value" id="stat-total-pedidos">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pendientes</div>
            <div class="stat-value" id="stat-pedidos-pendientes">—</div>
          </div>
        </div>

        <div class="filter-row"></div>

        <div class="table-wrap">
          <table id="orders-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Total</th>
                <th class="col-filter">Acciones</th>
              </tr>
            </thead>
            <tbody id="orders-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="order-modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="order-modal-title">Pedido</h2>
        <button type="button" class="modal-close" id="order-modal-close" aria-label="Cerrar">&times;</button>
      </div>
      <div id="order-modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="order-modal-cancel">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
