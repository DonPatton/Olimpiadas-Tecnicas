<!DOCTYPE html>
<html lang="es">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito · Panel de Control de Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .content-header-actions { display:flex; align-items:center; gap:10px; }
    .qty-control { display:inline-flex; align-items:center; gap:8px; }
    .qty-control .edit-btn { font-size:15px; line-height:1; }
    .qty-control .edit-btn:disabled { opacity:.35; cursor:not-allowed; }
    .qty-control span { min-width:22px; text-align:center; font-weight:600; }
    .cart-summary { display:flex; align-items:center; justify-content:flex-end; gap:20px; margin-top:16px; }
    .cart-total { font-size:14px; color:var(--text-secondary); }
    .cart-total strong { margin-left:8px; font-size:22px; color:var(--text-primary); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
  </style>
</head>
<body data-page="carrito">
  <div class="app">
    <app-sidebar></app-sidebar>
    <main class="main">
      <app-topbar></app-topbar>
      <section class="content">
        <div class="content-header">
          <h1 class="page-title">Carrito</h1>
          <div class="content-header-actions">
            <button class="btn btn-ghost" id="btn-vaciar-carrito" type="button">Vaciar carrito</button>
            <button class="btn btn-primary" id="btn-add-cart-item" type="button">Agregar al carrito</button>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Ítems en el carrito</div>
            <div class="stat-value" id="stat-cart-items">—</div>
          </div>
        </div>

        <div class="table-wrap">
          <table id="cart-table">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Ítem</th>
                <th>Precio unitario</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th class="col-filter">Acciones</th>
              </tr>
            </thead>
            <tbody id="cart-table-body"></tbody>
          </table>
        </div>

        <div class="cart-summary">
          <div class="cart-total">Total del pedido<strong id="cart-total">$0</strong></div>
          <button class="btn btn-primary" id="btn-confirmar-pedido" type="button">Confirmar pedido</button>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="cart-modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>Agregar al carrito</h2>
        <button type="button" class="modal-close" id="cart-modal-close" aria-label="Cerrar">&times;</button>
      </div>
      <form id="cart-form" novalidate>
        <div class="form-group">
          <label for="cart-tipo">Tipo</label>
          <select id="cart-tipo">
            <option value="producto">Producto</option>
            <option value="combo">Combo</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cart-item">Ítem</label>
          <select id="cart-item" required></select>
        </div>
        <div class="form-group">
          <label for="cart-cantidad">Cantidad</label>
          <input type="number" id="cart-cantidad" min="1" step="1" value="1" required>
        </div>
        <div class="form-error" id="cart-form-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cart-modal-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="cart-modal-submit">Agregar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
